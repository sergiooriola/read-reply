<!doctype html>
<meta charset="utf-8">
<title>read-reply</title>
<script>
  "use strict";
  // Speaks the chunks that read-reply serves, then closes, which ends headless Edge.
  const base = location.pathname;
  const post = (path, body = "") =>
    fetch(base + path, { method: "POST", body }).catch(() => {});

  // Edge loads its online voices after the page and announces them with
  // "voiceschanged"; wait a few seconds for the preferred one before falling back.
  function pickVoice(preferred) {
    return new Promise((resolve) => {
      const find = (names) => {
        const voices = speechSynthesis.getVoices();
        const named = (name) => voices.find((voice) => voice.name === name);
        return names.map(named).find(Boolean);
      };
      const tryPreferred = () => {
        const voice = find(preferred.slice(0, 1));
        if (voice) resolve(voice);
      };
      speechSynthesis.addEventListener("voiceschanged", tryPreferred);
      tryPreferred();
      setTimeout(() => {
        const spanish = speechSynthesis.getVoices().find((voice) => voice.lang === "es-ES");
        resolve(find(preferred) ?? spanish ?? null);
      }, 5000);
    });
  }

  function say(text, voice, rate) {
    return new Promise((resolve) => {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = voice?.lang ?? "es-ES";
      if (voice) utterance.voice = voice;
      utterance.rate = rate;
      utterance.onend = () => resolve();
      utterance.onerror = (event) => {
        // "interrupted" and "canceled" are what a stop request causes.
        const stopped = ["interrupted", "canceled"].includes(event.error);
        if (!stopped) post("error", event.error);
        resolve();
      };
      speechSynthesis.speak(utterance);
    });
  }

  async function main() {
    const reply = await (await fetch(base + "reply")).json();
    let stopped = false;
    const stop = () => {
      stopped = true;
      speechSynthesis.cancel();
    };
    const poll = setInterval(async () => {
      try {
        if ((await (await fetch(base + "state")).json()).stop) stop();
      } catch {
        stop(); // read-reply is gone
      }
    }, 200);
    try {
      const voice = await pickVoice(reply.voices);
      for (const text of reply.chunks) {
        if (stopped) break;
        await say(text, voice, reply.rate);
      }
    } finally {
      clearInterval(poll);
    }
  }

  main()
    .catch((error) => post("error", String(error)))
    .finally(async () => {
      await post("finished");
      window.close();
    });
</script>
