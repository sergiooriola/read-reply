<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Leer respuesta</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#f3f3f3, #202020);
    --fg: light-dark(#1b1b1b, #f3f3f3);
    --button: light-dark(#ffffff, #2d2d2d);
    --button-hover: light-dark(#ebebeb, #383838);
    --border: light-dark(#c8c8c8, #454545);
    --accent: light-dark(#005fb8, #60cdff);
    font: 14px/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); user-select: none; overflow: hidden; }
  main {
    box-sizing: border-box;
    height: 100%;
    padding: 8px 12px;
    display: grid;
    grid-template-rows: 1fr auto;
    gap: 6px;
  }
  .controls { display: flex; align-items: center; gap: 4px; }
  .spacer { flex: 1; }
  button {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--button);
    color: var(--fg);
  }
  button:hover:enabled { background: var(--button-hover); }
  button:disabled { opacity: 0.4; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button svg { width: 18px; height: 18px; fill: currentColor; }
  svg [hidden] { display: none; } /* SVG ignores the attribute on its own */
  #toggle { width: 40px; }
  output { min-width: 3.4em; text-align: center; font-variant-numeric: tabular-nums; }
  #position { width: 100%; margin: 0; accent-color: var(--accent); }
</style>
<main>
  <div class="controls">
    <button id="previous" aria-label="Frase anterior" title="Frase anterior (←)">
      <svg aria-hidden="true" viewBox="0 0 16 16"><rect x="2.5" y="3" width="2" height="10" rx="0.75"/><path d="M13.5 3.6v8.8a.8.8 0 0 1-1.24.67L6 8.67a.8.8 0 0 1 0-1.34l6.26-4.4a.8.8 0 0 1 1.24.67Z"/></svg>
    </button>
    <button id="toggle" aria-label="Pausar" title="Pausar (espacio)">
      <svg aria-hidden="true" viewBox="0 0 16 16">
        <g id="pause-icon"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></g>
        <path id="play-icon" hidden d="M4 2.5v11a1 1 0 0 0 1.5.86l9-5.5a1 1 0 0 0 0-1.72l-9-5.5A1 1 0 0 0 4 2.5Z"/>
      </svg>
    </button>
    <button id="next" aria-label="Frase siguiente" title="Frase siguiente (→)">
      <svg aria-hidden="true" viewBox="0 0 16 16"><rect x="11.5" y="3" width="2" height="10" rx="0.75"/><path d="M2.5 3.6v8.8a.8.8 0 0 0 1.24.67L10 8.67a.8.8 0 0 0 0-1.34L3.74 2.93a.8.8 0 0 0-1.24.67Z"/></svg>
    </button>
    <span class="spacer"></span>
    <button id="slower" aria-label="Más lento" title="Más lento (−)">
      <svg aria-hidden="true" viewBox="0 0 16 16"><rect x="2" y="7" width="12" height="2" rx="1"/></svg>
    </button>
    <output id="rate" aria-label="Velocidad"></output>
    <button id="faster" aria-label="Más rápido" title="Más rápido (+)">
      <svg aria-hidden="true" viewBox="0 0 16 16"><rect x="2" y="7" width="12" height="2" rx="1"/><rect x="7" y="2" width="2" height="12" rx="1"/></svg>
    </button>
    <span class="spacer"></span>
    <button id="stop" aria-label="Parar" title="Parar (Esc)">
      <svg aria-hidden="true" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5"/></svg>
    </button>
  </div>
  <input id="position" type="range" min="0" max="1000" value="0" aria-label="Punto de la respuesta">
</main>
<script type="module">
  // The reading window: reading.mjs speaks; this page shows the controls and
  // talks to read-reply, which serves it. It closes when the reading ends,
  // and Edge with it.
  import { RATE_MAX, RATE_MIN, RATE_STEP, Reading, pickVoice } from "./reading.mjs";

  const base = location.pathname;
  const post = (path, body = "") =>
    fetch(base + path, { method: "POST", body }).catch(() => {});
  // Reports and speeds go to read-reply one after another, in order; the
  // last one is awaited before "finished".
  let sent = Promise.resolve();
  const send = (path, body) => (sent = sent.then(() => post(path, body)));
  const $ = (id) => document.getElementById(id);
  const rateText = new Intl.NumberFormat("es-ES", {
    minimumFractionDigits: 1,
    maximumFractionDigits: 1,
  });

  async function main() {
    const reply = await (await fetch(base + "reply")).json();
    const { promise: finished, resolve: finish } = Promise.withResolvers();
    let dragging = false; // the slider follows the voice, but not under the pointer
    // The controls and a stop work at once; it speaks once the voice is known.
    const reading = new Reading({
      synth: speechSynthesis,
      Utterance: SpeechSynthesisUtterance,
      chunks: reply.chunks,
      voice: null,
      preferred: reply.voices,
      rate: Math.min(Math.max(reply.rate, RATE_MIN), RATE_MAX),
      onProgress: (fraction) => {
        if (!dragging) $("position").value = Math.round(fraction * 1000);
      },
      onSkip: (error) => send("error", error),
      onFinish: finish,
    });

    const showRate = () => {
      $("rate").value = `${rateText.format(reading.rate)}×`;
      $("slower").disabled = reading.rate <= RATE_MIN;
      $("faster").disabled = reading.rate >= RATE_MAX;
    };
    const togglePause = () => {
      reading.togglePause();
      const label = reading.paused ? "Continuar" : "Pausar";
      $("toggle").setAttribute("aria-label", label);
      $("toggle").title = `${label} (espacio)`;
      // SVG elements have no "hidden" property: the attribute itself.
      $("pause-icon").toggleAttribute("hidden", reading.paused);
      $("play-icon").toggleAttribute("hidden", !reading.paused);
    };
    const changeRate = (steps) => {
      const rate = Math.round((reading.rate + steps * RATE_STEP) * 10) / 10;
      if (rate < RATE_MIN || rate > RATE_MAX) return;
      reading.setRate(rate);
      send("rate", String(rate)); // read-reply keeps it for the next reading
      showRate();
    };

    $("toggle").addEventListener("click", togglePause);
    $("previous").addEventListener("click", () => reading.skip(-1));
    $("next").addEventListener("click", () => reading.skip(1));
    $("position").addEventListener("pointerdown", () => (dragging = true));
    $("position").addEventListener("pointerup", () => (dragging = false));
    $("position").addEventListener("change", (event) => {
      dragging = false;
      reading.seek(event.target.value / 1000);
    });
    $("slower").addEventListener("click", () => changeRate(-1));
    $("faster").addEventListener("click", () => changeRate(1));
    $("stop").addEventListener("click", () => reading.stop());
    document.addEventListener("keydown", (event) => {
      const action = {
        " ": togglePause,
        ArrowLeft: () => reading.skip(-1),
        ArrowRight: () => reading.skip(1),
        "-": () => changeRate(-1),
        "+": () => changeRate(1),
        Escape: () => reading.stop(),
      }[event.key];
      if (!action) return;
      event.preventDefault(); // or Space presses a button, an arrow moves the slider
      action();
    });
    showRate();

    // F9 again asks read-reply to stop, which tells the page here.
    const poll = setInterval(async () => {
      try {
        if ((await (await fetch(base + "state")).json()).stop) reading.stop();
      } catch {
        reading.stop(); // read-reply is gone
      }
    }, 200);
    reading.voice = await Promise.race([
      pickVoice(speechSynthesis, reply.voices),
      finished.then(() => null), // stopped meanwhile: start() does nothing
    ]);
    reading.start();
    const error = await finished;
    clearInterval(poll);
    if (error) send("error", error);
    await sent; // before "finished"
  }

  // Closing the window is stopping, not Edge failing.
  addEventListener("pagehide", () => navigator.sendBeacon(base + "finished"));

  main()
    .catch((error) => send("error", String(error)))
    .finally(async () => {
      await sent;
      await post("finished");
      window.close();
    });
</script>
